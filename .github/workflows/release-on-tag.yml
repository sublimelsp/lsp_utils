name: Release On Push Tag

on:
  push:
    tags:
      # Releases for the Python 3.13 and 3.14 plugin hosts, made from main.
      - '[0-9]*'
      # Releases for the Python 3.8 plugin host, made from the py38 branch.
      - 'py38-*'

jobs:
  release:
    name: Create and publish release
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build wheel
        run: uv build --wheel

      - name: Check if release exists
        id: release_exists
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload wheel to existing release
        if: steps.release_exists.outputs.release_exists == 'true'
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber

      - name: Create release & upload wheel
        if: steps.release_exists.outputs.release_exists == 'false'
        run: |
          # Only releases from main are marked as latest so that py38 releases don't take over the "latest" badge.
          if [[ "$GITHUB_REF_NAME" == py38-* ]]; then
            LATEST=false
          else
            LATEST=true
          fi
          gh release create --generate-notes --latest=$LATEST -t "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" dist/*.whl
