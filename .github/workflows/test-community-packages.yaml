name: Test Community Packages

on:
  pull_request:
    branches:
      - main

jobs:
  type-check:
    name: Type-check community packages
    runs-on: macOS-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          path: lsp_utils

      - name: Check out lsp_maintainers
        uses: actions/checkout@v7
        with:
          repository: sublimelsp/lsp_maintainers
          path: lsp_maintainers

      - name: Check out community package repositories
        run: |
          python3 scripts/checkout-repos.py \
            --preferred-branch ${{ github.head_ref }} \
            --no-collect-dependencies \
            --exclude lsp_utils \
            --exclude Chialisp \
            --exclude LSP-aurelia \
            --exclude LSP-gnols \
            --exclude LSP-MaaFramework \
            --exclude LSP-pyvoice \
            --exclude LSP-vale-ls \
            --exclude WolframLanguage
        working-directory: lsp_maintainers

      - name: Use checkout of lsp_utils from PR
        run: |
          mv ${{ github.workspace }}/lsp_utils/lsp_utils lsp_maintainers/repositories

      - name: Collect dependencies of packages
        run: python3 scripts/collect-dependencies.py
        working-directory: lsp_maintainers

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Sync venv and type check
        run: |
          uv sync
          uv pip install -r requirements-packages.txt
          uv run basedpyright
        working-directory: lsp_maintainers/repositories
