name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  deploy_docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15

      - run: |
          cd docs
          make install
          make build
          make deploy
