name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  deploy_docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15

      - run: pip install --group docs
      - run: zensical build --clean
      - run: ghp-import --no-jekyll --push --force site
