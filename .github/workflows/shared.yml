name: CI

on:
  workflow_call:
    inputs:
      lsp_use_latest_tag:
        description: "When true, use the latest LSP release tag; otherwise use the latest commit on the default branch"
        type: boolean
        default: true
        required: false

jobs:
  latest_tags:
    name: Latest tags
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      lsp: ${{ steps.tags.outputs.lsp }}
      sublime_lib: ${{ steps.tags.outputs.lib }}
    steps:
      - id: tags
        run: |
          if [[ "${{ inputs.lsp_use_latest_tag }}" == "true" ]]; then
            echo "lsp=$(gh release view --repo sublimelsp/LSP --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          else
            echo "lsp=$(gh api repos/sublimelsp/LSP -q .default_branch)" >> "$GITHUB_OUTPUT"
          fi
          echo "lib=$(gh release view --repo SublimeText/sublime_lib --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (${{ matrix.os }})
    needs: latest_tags
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macOS-latest", "windows-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      # Used by the test that runs LSP-pyright with the system Node.js.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: actions/checkout@v7
        with:
          path: lsp_utils

      # Tests lsp_utils through the latest releases of LSP-pyright and LSP-ruff, with the published lsp_utils replaced
      # by this checkout. See https://github.com/sublimelsp/lsp_smoke_test.
      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          install-package: false
          lsp-ref: ${{ needs.latest_tags.outputs.lsp }}
          extra-packages: |
            LSP-pyright
            LSP-ruff
          local-libraries: lsp_utils=lsp_utils/lsp_utils
          fixture-dir: |
            lsp_utils/tests/smoke/pyright-system-node
            lsp_utils/tests/smoke/pyright-local-node
            lsp_utils/tests/smoke/ruff

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: latest_tags
    steps:
      # Checked out at the workspace root so that annotation paths match the repository paths.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - run: |
          sudo apt update
          sudo apt install --no-install-recommends -y x11-xserver-utils

      # Cloned next to the checkout, where pyright's `extraPaths` expect them.
      - name: Clone dependencies for type checking
        run: |
          git clone --branch "${{ needs.latest_tags.outputs.lsp }}" --depth 1 https://github.com/sublimelsp/LSP.git ../LSP
          git clone --branch "${{ needs.latest_tags.outputs.sublime_lib }}" --depth 1 https://github.com/SublimeText/sublime_lib.git ../sublime_lib

      - run: pip3 install tox --user
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: tox
        env:
          RUFF_OUTPUT_FORMAT: github
