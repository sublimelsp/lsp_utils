name: Test

# No path filters: the CI job below is a required check, so the workflow has to run for every pull request.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to a pull request cancels the run that is still going for the previous one. On main, every commit gets its
# own group, so runs there are never cancelled or queued behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest-lsp-tag:
    uses: ./.github/workflows/shared.yml
    with:
      lsp_use_latest_tag: true

  latest-lsp-commit:
    uses: ./.github/workflows/shared.yml
    with:
      lsp_use_latest_tag: false

  # The check that branch protection requires, so that it doesn't need updating when the jobs above change.
  ci:
    name: CI
    if: always()
    needs:
      - latest-lsp-tag
      - latest-lsp-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
