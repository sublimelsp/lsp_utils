# https://docs.netlify.com/configure-builds/file-based-configuration

[build]
  environment = { PYTHON_VERSION = "3.13", MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS = "[]" }
  base    = "docs/"
  publish = "site/"
  command = "zensical build --clean"
  # The API docs are generated from the docstrings so also build when the Python source changes.
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../lsp_utils/ ../netlify.toml"
