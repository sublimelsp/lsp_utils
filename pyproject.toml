[project]
name = "lsp-utils"
description = "Library with LSP-related utilities for Sublime Text "
readme = "README.md"
requires-python = ">=3.8"
license-files = ["LICENSE"]
authors = [{ name = "rchl" }]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[dependency-groups]
docs = [
  "ghp-import==2.1.0",
  "mkdocstrings-python==2.0.10",
  "zensical==0.0.73",
]

[build-system]
requires = ["hatch-vcs>=0.4", "hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.*",
  "*.lock",
]

[tool.hatch.build.hooks.vcs]
version-file = "lsp_utils/_version.py"
tag-pattern = "v{version}"

[tool.hatch.version]
source = "vcs"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
# Don't report errors in external packages.
follow_imports = "silent"
mypy_path = [
  "..",
  "../LSP/stubs",
  "../sublime_lib",
]
namespace_packages = true
strict_optional = true

[[tool.mypy.overrides]]
module = "lsp_utils.third_party.semantic_version.*"
ignore_errors = true
ignore_missing_imports = true

[tool.pyright]
extraPaths = [
  "..",
  "../LSP/stubs",
  "../sublime_lib",
]
ignore = [
  "**/third_party/",
  "**/tests/smoke/",
]
pythonVersion = "3.8"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = [
  "docs",
  "lsp_utils/third_party",
  "tests/smoke",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
# Enable preview rules.
preview = true
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
select = ["ALL"]
ignore = [
  "any-type",  # https://docs.astral.sh/ruff/rules/any-type/
  "blind-except",  # https://docs.astral.sh/ruff/rules/blind-except/
  "missing-copyright-notice",  # https://docs.astral.sh/ruff/rules/missing-copyright-notice/
  "complex-structure",  # https://docs.astral.sh/ruff/rules/complex-structure/
  "undocumented-public-module",  # https://docs.astral.sh/ruff/rules/undocumented-public-module/
  "undocumented-public-class",  # https://docs.astral.sh/ruff/rules/undocumented-public-class/
  "undocumented-public-method",  # https://docs.astral.sh/ruff/rules/undocumented-public-method/
  "undocumented-public-function",  # https://docs.astral.sh/ruff/rules/undocumented-public-function/
  "undocumented-public-package",  # https://docs.astral.sh/ruff/rules/undocumented-public-package/
  "undocumented-public-init",  # https://docs.astral.sh/ruff/rules/undocumented-public-init/
  "incorrect-blank-line-before-class",
  "multi-line-summary-first-line",
  "docstring-missing-returns",  # https://docs.astral.sh/ruff/rules/docstring-missing-returns/
  "docstring-missing-exception",  # https://docs.astral.sh/ruff/rules/docstring-missing-exception/
  "import-outside-top-level",  # https://docs.astral.sh/ruff/rules/import-outside-top-level/
  "too-many-branches",  # https://docs.astral.sh/ruff/rules/too-many-branches/
  "too-many-arguments",  # https://docs.astral.sh/ruff/rules/too-many-arguments/
  "too-many-statements",  # https://docs.astral.sh/ruff/rules/too-many-statements/
  "too-many-nested-blocks",  # https://docs.astral.sh/ruff/rules/too-many-nested-blocks/
  "no-self-use",  # https://docs.astral.sh/ruff/rules/no-self-use/
  "bad-quotes-inline-string",  # https://docs.astral.sh/ruff/rules/bad-quotes-inline-string/#bad-quotes-inline-string-q000
  "assert",
  "relative-imports",  # https://docs.astral.sh/ruff/rules/relative-imports/
  "raise-vanilla-class",  # https://docs.astral.sh/ruff/rules/raise-vanilla-class/
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
  "implicit-namespace-package",  # https://docs.astral.sh/ruff/rules/implicit-namespace-package/
]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
no-sections = true
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.tox]
env_list = ["py3"]
skipsdist = true

[tool.tox.env_run_base]
deps = [
  "basedpyright==1.40.2",
  "ruff==0.17.2",
]
# Lets both tools emit GitHub Actions annotations when running in CI.
pass_env = ["GITHUB_ACTIONS", "RUFF_OUTPUT_FORMAT"]
commands = [
  ["basedpyright", "lsp_utils"],
  ["ruff", "check"],
]
